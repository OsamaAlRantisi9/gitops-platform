apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
# Always an immutable SHA tag, never "latest". To change it, run the "Promote to production"
# workflow (.github/workflows/promote.yml): it opens a pull request with the exact tag already
# running in staging, and merging that pull request is the approval.
images:
  - name: ghcr.io/osamaalrantisi9/hello-api
    newTag: sha-19e030c
patches:
  - target:
      kind: Ingress
      name: hello-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hello.localtest.me
  - target:
      kind: HorizontalPodAutoscaler
      name: hello-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 6
