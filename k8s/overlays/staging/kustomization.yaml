apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
# CI rewrites this tag on every merge to main (image promotion into staging).
images:
  - name: ghcr.io/osamaalrantisi9/hello-api
    newTag: sha-19e030c
patches:
  - target:
      kind: Ingress
      name: hello-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.hello.localtest.me
  - target:
      kind: HorizontalPodAutoscaler
      name: hello-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: hello-api
    patch: |-
      # With a single replica, minAvailable: 1 would block node drains forever.
      - op: replace
        path: /spec/minAvailable
        value: 0
